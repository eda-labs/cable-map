apiVersion: apps/v1
kind: Deployment
metadata:
  name: cable-map
  namespace: eda-system
  labels:
    app.kubernetes.io/name: cable-map
    app.kubernetes.io/part-of: cable-map
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cable-map
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cable-map
        app.kubernetes.io/part-of: cable-map
    spec:
      serviceAccountName: cable-map
      containers:
        - name: cable-map
          image: image/cable-map
          imagePullPolicy: IfNotPresent
          env:
            - name: EDA_NAMESPACE
              value: eda
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
