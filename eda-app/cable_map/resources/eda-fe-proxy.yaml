apiVersion: v1
kind: Service
metadata:
  name: eda-fe-original
  namespace: eda-system
spec:
  ports:
    - name: fe
      port: 51101
      protocol: TCP
      targetPort: 51101
  selector:
    eda.nokia.com/app: flowengine
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cable-map-eda-fe-proxy
  namespace: eda-system
  labels:
    app.kubernetes.io/name: cable-map-eda-fe-proxy
    app.kubernetes.io/part-of: cable-map
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cable-map-eda-fe-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cable-map-eda-fe-proxy
        app.kubernetes.io/part-of: cable-map
    spec:
      serviceAccountName: eda-ce
      containers:
        - name: proxy
          image: image/cable-map
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /app/proxy/proxy.js
          env:
            - name: PORT
              value: "51101"
            - name: UPSTREAM
              value: https://eda-fe-original.eda-system.svc:51101
            - name: UPSTREAM_SERVER_NAME
              value: eda-fe.eda-system.svc
          ports:
            - name: fe
              containerPort: 51101
              protocol: TCP
            - name: health
              containerPort: 18080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - mountPath: /app/proxy
              name: proxy-files
              readOnly: true
            - mountPath: /var/run/eda/tls/internal/client
              name: tls
              readOnly: true
            - mountPath: /var/run/eda/tls/internal/trust
              name: trustbundle
              readOnly: true
      volumes:
        - name: proxy-files
          configMap:
            name: cable-map-eda-fe-proxy
        - name: tls
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/dns-names: eda-fe.${POD_NAMESPACE}.svc,eda-fe.${POD_NAMESPACE}.svc.cluster.local,eda-fe,internal.eda.nokia.com
              csi.cert-manager.io/duration: 720h0m0s
              csi.cert-manager.io/issuer-name: eda-internal-issuer
              csi.cert-manager.io/key-algorithm: ECDSA
              csi.cert-manager.io/renew-before: 240h0m0s
        - name: trustbundle
          configMap:
            defaultMode: 420
            name: eda-internal-trust-bundle
            optional: false
