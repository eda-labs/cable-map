apiVersion: v1
kind: ServiceAccount
metadata:
  name: cable-map
  namespace: eda-system
  labels:
    app.kubernetes.io/name: cable-map
    app.kubernetes.io/part-of: cable-map
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cable-map-reader
  labels:
    app.kubernetes.io/name: cable-map
    app.kubernetes.io/part-of: cable-map
rules:
  - apiGroups:
      - core.eda.nokia.com
    resources:
      - toponodes
      - topolinks
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - interfaces.eda.nokia.com
    resources:
      - interfaces
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cable-map-reader
  labels:
    app.kubernetes.io/name: cable-map
    app.kubernetes.io/part-of: cable-map
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cable-map-reader
subjects:
  - kind: ServiceAccount
    name: cable-map
    namespace: eda-system
