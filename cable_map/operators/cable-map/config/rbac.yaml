apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    eda.labs/app: cable-map
    eda.labs/app-group: app-cable-map
  name: cable-map-auth
  namespace: eda-system # eda-set: ${EDA_BASE_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["keycloak-admin-secret", "eda-api-ca"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    eda.labs/app: cable-map
    eda.labs/app-group: app-cable-map
  name: cable-map-auth
  namespace: eda-system # eda-set: ${EDA_BASE_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: cable-map
    namespace: eda-system # eda-set: ${EDA_BASE_NAMESPACE}
roleRef:
  kind: Role
  name: cable-map-auth
  apiGroup: rbac.authorization.k8s.io
